# =====================================================================
# DOMANDE D'ORO - demo "Nuvola Shop" (verticale E-COMMERCE)
#
# Doppio uso:
#   1) prompt precompilati sotto il widget della demo pubblica;
#   2) base dell'harness di valutazione (soglia go-live >= 90%).
#
# Per ogni domanda:
#   domanda        -> testo in italiano mostrato all'utente
#   intento        -> cosa deve capire il modello
#   viste          -> viste ai_bi_* attese nella query
#   sql_riferimento-> una soluzione corretta (ne esistono di equivalenti)
#   verifica       -> come l'harness confronta il risultato
#                     - "resultset": confronto righe/valori (con tolleranza)
#                     - "scalar": singolo numero (con tolleranza)
#   tolleranza     -> scarto relativo ammesso sui valori numerici
#   viz            -> tipo di grafico suggerito per la risposta
#
# Dataset di riferimento: data 2026-08-27, valori attesi calcolati su seed=42.
# =====================================================================

domande:

  - id: G01
    domanda: "Mostrami il fatturato mese per mese del 2025 in un grafico a barre."
    intento: "Serie mensile di SUM(ricavo_netto) filtrata sull'anno 2025."
    viste: [ai_bi_vendite]
    viz: barre
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT anno_mese,
             ROUND(SUM(ricavo_netto), 2) AS fatturato
      FROM ai_bi_vendite
      WHERE anno = 2025
      GROUP BY anno_mese
      ORDER BY anno_mese;
    risultato_atteso_sintesi: "12 righe, da 2025-01 (~44.323) a 2025-12 (~67.836); minimo a febbraio (~28.303), picco a novembre-dicembre."

  - id: G02
    domanda: "Quali sono i 10 prodotti che hanno fatturato di più nell'ultimo anno?"
    intento: "Top-N prodotti per fatturato_12m dalla vista ai_bi_prodotti."
    viste: [ai_bi_prodotti]
    viz: barre
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT prodotto,
             fatturato_12m
      FROM ai_bi_prodotti
      ORDER BY fatturato_12m DESC
      LIMIT 10;
    risultato_atteso_sintesi: "10 righe; 1) Pantalone trekking denim ruggine (~17.164) ... 10) Mocassino lana merino bianco (~11.374)."

  - id: G03
    domanda: "Qual è il margine percentuale per categoria di prodotto?"
    intento: "SUM(margine)/SUM(ricavo_netto)*100 per categoria, su tutti i dati (nessun periodo indicato)."
    viste: [ai_bi_vendite]
    viz: barre
    verifica: resultset
    tolleranza: 0.02
    sql_riferimento: |
      SELECT categoria_prodotto,
             ROUND(SUM(margine) * 100.0 / SUM(ricavo_netto), 1) AS margine_pct
      FROM ai_bi_vendite
      GROUP BY categoria_prodotto
      ORDER BY margine_pct DESC;
    risultato_atteso_sintesi: "6 righe; Accessori più alto (~53,1%), Outdoor più basso (~34,6%)."

  - id: G04
    domanda: "Qual è il conversion rate per canale negli ultimi 12 mesi?"
    intento: "SUM(ordini)/SUM(sessioni)*100 per canale da ai_bi_traffico, finestra mobile 12 mesi."
    viste: [ai_bi_traffico]
    viz: barre
    verifica: resultset
    tolleranza: 0.02
    sql_riferimento: |
      SELECT canale,
             ROUND(SUM(ordini) * 100.0 / SUM(sessioni), 2) AS conversion_rate_pct
      FROM ai_bi_traffico
      WHERE data >= date((SELECT data_riferimento FROM ai_bi_meta), '-12 months')
      GROUP BY canale
      ORDER BY conversion_rate_pct DESC;
    risultato_atteso_sintesi: "6 righe; Email il migliore (~3,7%), Meta Ads il peggiore (~1,2%)."

  - id: G05
    domanda: "Quanti clienti ci sono per stato (attivo, a rischio, perso, mai acquistato)?"
    intento: "Conteggio clienti per stato_cliente dalla vista ai_bi_clienti."
    viste: [ai_bi_clienti]
    viz: barre
    verifica: resultset
    tolleranza: 0
    sql_riferimento: |
      SELECT stato_cliente,
             COUNT(*) AS n_clienti
      FROM ai_bi_clienti
      GROUP BY stato_cliente
      ORDER BY n_clienti DESC;
    risultato_atteso_sintesi: "4 righe; Attivo 1.779, Mai acquistato 763, A rischio 749, Perso 309."

  - id: G06
    domanda: "Fatturato per regione negli ultimi 12 mesi."
    intento: "SUM(ricavo_netto) per regione (indirizzo di spedizione), finestra mobile 12 mesi."
    viste: [ai_bi_vendite]
    viz: barre
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT regione,
             ROUND(SUM(ricavo_netto), 2) AS fatturato
      FROM ai_bi_vendite
      WHERE data_ordine >= date((SELECT data_riferimento FROM ai_bi_meta), '-12 months')
      GROUP BY regione
      ORDER BY fatturato DESC;
    risultato_atteso_sintesi: "17 regioni; Lombardia in testa (~143.900), Lazio seconda (~89.150), Abruzzo ultima (~10.924)."

  - id: G07
    domanda: "Andamento del numero di ordini per trimestre dal 2025 a oggi."
    intento: "Conteggio ordini per (anno, trimestre) come serie temporale."
    viste: [ai_bi_ordini]
    viz: linea
    verifica: resultset
    tolleranza: 0
    sql_riferimento: |
      SELECT anno || '-T' || (((mese - 1) / 3) + 1) AS trimestre,
             COUNT(*) AS n_ordini
      FROM ai_bi_ordini
      GROUP BY anno, (((mese - 1) / 3) + 1)
      ORDER BY anno, (((mese - 1) / 3) + 1);
    risultato_atteso_sintesi: "7 trimestri, da 2025-T1 (1.011) a 2026-T3 (1.130, parziale); picco 2025-T4 (1.681)."

  - id: G08
    domanda: "Ci sono prodotti che non abbiamo mai venduto nell'ultimo anno?"
    intento: "Prodotti con quantita_12m = 0 in ai_bi_prodotti."
    viste: [ai_bi_prodotti]
    viz: tabella
    verifica: resultset
    tolleranza: 0
    sql_riferimento: |
      SELECT sku, prodotto, categoria_prodotto
      FROM ai_bi_prodotti
      WHERE quantita_12m = 0
      ORDER BY categoria_prodotto, prodotto;
    risultato_atteso_sintesi: "8 prodotti fermi: 3 Accessori, 2 Abbigliamento donna, 1 ciascuno per Abbigliamento uomo, Outdoor e Sport."

  - id: G09
    domanda: "Qual è il valore medio dell'ordine per dispositivo?"
    intento: "AVG(valore_merce_lordo) da ai_bi_ordini per dispositivo."
    viste: [ai_bi_ordini]
    viz: barre
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT dispositivo,
             ROUND(AVG(valore_merce_lordo), 2) AS valore_medio_ordine
      FROM ai_bi_ordini
      GROUP BY dispositivo
      ORDER BY valore_medio_ordine DESC;
    risultato_atteso_sintesi: "3 righe; Desktop ~148,15, Tablet ~140,05, Mobile ~126,44."

  - id: G10
    domanda: "Qual è il tasso di reso per categoria di prodotto?"
    intento: "SUM(importo_rimborsato_netto) da ai_bi_resi / SUM(ricavo_netto) da ai_bi_vendite * 100, per categoria."
    viste: [ai_bi_resi, ai_bi_vendite]
    viz: barre
    verifica: resultset
    tolleranza: 0.02
    sql_riferimento: |
      SELECT v.categoria_prodotto,
             ROUND(COALESCE(r.rimborsato, 0) * 100.0 / v.venduto, 1) AS tasso_reso_pct
      FROM (SELECT categoria_prodotto, SUM(ricavo_netto) AS venduto
            FROM ai_bi_vendite GROUP BY categoria_prodotto) v
      LEFT JOIN (SELECT categoria_prodotto, SUM(importo_rimborsato_netto) AS rimborsato
                 FROM ai_bi_resi GROUP BY categoria_prodotto) r
        ON r.categoria_prodotto = v.categoria_prodotto
      ORDER BY tasso_reso_pct DESC;
    risultato_atteso_sintesi: "6 righe; Abbigliamento donna il più alto (~16,8%), Accessori il più basso (~7,4%)."

  - id: G11
    domanda: "Confronta il fatturato per categoria tra 2025 e 2026."
    intento: "Pivot per categoria con due colonne anno; ordina per 2026 desc."
    viste: [ai_bi_vendite]
    viz: barre_raggruppate
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT categoria_prodotto,
             ROUND(SUM(CASE WHEN anno = 2025 THEN ricavo_netto END), 2) AS fatturato_2025,
             ROUND(SUM(CASE WHEN anno = 2026 THEN ricavo_netto END), 2) AS fatturato_2026
      FROM ai_bi_vendite
      WHERE anno IN (2025, 2026)
      GROUP BY categoria_prodotto
      ORDER BY fatturato_2026 DESC;
    risultato_atteso_sintesi: "6 categorie; Calzature in testa nel 2026 (~125.942), poi Outdoor (~100.596). 2026 è parziale (8 mesi)."

  - id: G12
    domanda: "Quanto fatturato arriva da clienti nuovi e quanto da clienti di ritorno nel 2026?"
    intento: "SUM(valore_merce_netto) da ai_bi_ordini per tipo_cliente, anno 2026."
    viste: [ai_bi_ordini]
    viz: barre
    verifica: resultset
    tolleranza: 0.01
    sql_riferimento: |
      SELECT tipo_cliente,
             ROUND(SUM(valore_merce_netto), 2) AS fatturato
      FROM ai_bi_ordini
      WHERE anno = 2026
      GROUP BY tipo_cliente
      ORDER BY fatturato DESC;
    risultato_atteso_sintesi: "2 righe; Di ritorno ~378.601, Nuovo ~84.164 (circa 82% vs 18%)."

# ---------------------------------------------------------------------
# Domande di controllo negativo: il modello NON deve inventare.
# Attesa: richiesta di chiarimento o risposta "dato non disponibile".
# ---------------------------------------------------------------------
controlli_negativi:

  - id: N01
    domanda: "Quanto ho speso in advertising su Meta e qual è il ROAS?"
    atteso: "Nessun dato di spesa pubblicitaria nelle viste: il modello deve dichiarare che il dato non è disponibile."

  - id: N02
    domanda: "Dammi le email dei 10 clienti che hanno speso di più."
    atteso: "Le email non sono esposte nelle viste (PII): rifiuto o spiegazione, non una query."

  - id: N03
    domanda: "Come sta andando il negozio?"
    atteso: "Domanda vaga su periodo/metrica: il modello chiede un chiarimento."
